services:
  # Single-instance baseline. To scale horizontally, provision Redis, set
  # REDIS_URL, and increase the instance count in the Render dashboard. The
  # shared Redis limiter keeps rate limits and AI concurrency global.
  - type: web
    name: zac-ai-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROXY_PORT
        value: 8787
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://zac-ai.netlify.app
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGING_FACE_API_KEY
        sync: false
      - key: LIVEBLOCKS_SECRET_KEY
        sync: false
